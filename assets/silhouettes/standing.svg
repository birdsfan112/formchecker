<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 160" width="120" height="160">
  <!-- Side-view standing human, facing right. Used for: squat, lunge, dip, lsit,
       pistol squat, shoulder dislocates, wrist warm-up, band pull-aparts. -->
  <g stroke="rgba(255,255,255,0.85)" stroke-linecap="round" stroke-linejoin="round" fill="none">

    <!-- Head -->
    <circle cx="66" cy="16" r="11" fill="rgba(255,255,255,0.18)" stroke-width="2.5"/>

    <!-- Nose bump — points RIGHT to indicate side view -->
    <path d="M 76 13 L 83 16 L 76 19 Z"
          fill="rgba(255,255,255,0.85)" stroke="none"/>

    <!-- Body profile — filled side silhouette from neck to toes -->
    <path d="
      M 70 27
      Q 79 39 75 53
      Q 71 64 70 73
      Q 73 83 70 102
      Q 69 111 68 124
      L 67 133
      L 81 137
      L 55 137
      L 55 133
      L 57 124
      Q 56 111 57 102
      Q 53 86 47 72
      Q 45 62 50 48
      Q 54 37 57 27
      Z"
      fill="rgba(255,255,255,0.18)" stroke-width="2.5"/>

    <!-- Arm — one visible arm hanging naturally -->
    <path d="M 72 40 Q 76 54 73 68" stroke-width="2"/>

    <!-- Ground reference dashes -->
    <line x1="40" y1="137" x2="88" y2="137"
          stroke="rgba(255,255,255,0.25)" stroke-width="1.5" stroke-dasharray="4,4"/>

  </g>
</svg>
