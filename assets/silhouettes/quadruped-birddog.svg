<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 110" width="200" height="110">
  <!-- Side-view bird-dog. Person faces LEFT. Used for: bird-dog exercise.
       One arm extended forward, opposite leg extended backward (horizontal).
       Supporting arm and knee on ground. -->
  <g stroke="rgba(255,255,255,0.85)" stroke-linecap="round" stroke-linejoin="round" fill="none">

    <!-- Ground line -->
    <line x1="8" y1="92" x2="192" y2="92"
          stroke="rgba(255,255,255,0.45)" stroke-width="2"/>

    <!-- Head — forward (left), nose pointing LEFT -->
    <circle cx="42" cy="50" r="10" fill="rgba(255,255,255,0.18)" stroke-width="2.5"/>
    <path d="M 33 47 L 26 50 L 33 53 Z"
          fill="rgba(255,255,255,0.85)" stroke="none"/>

    <!-- Torso — horizontal body block -->
    <path d="
      M 62 38
      L 138 42
      L 138 58
      L 62 54
      Z"
      fill="rgba(255,255,255,0.18)" stroke-width="2.5"/>

    <!-- Extended ARM — forward-horizontal from front shoulder (left/forward) -->
    <path d="
      M 62 46
      L 18 44
      L 18 50
      L 62 52
      Z"
      fill="rgba(255,255,255,0.18)" stroke-width="2"/>

    <!-- Supporting arm — front shoulder down to hand on ground -->
    <path d="
      M 62 50
      Q 64 70 66 92
      L 74 92
      Q 73 70 70 50
      Z"
      fill="rgba(255,255,255,0.18)" stroke-width="2"/>

    <!-- Extended LEG — backward-horizontal from rear hip (right/backward) -->
    <path d="
      M 138 46
      L 182 44
      L 182 50
      L 138 52
      Z"
      fill="rgba(255,255,255,0.18)" stroke-width="2"/>

    <!-- Supporting knee — rear hip down to knee on ground -->
    <path d="
      M 138 50
      Q 136 70 134 92
      L 142 92
      Q 143 70 146 50
      Z"
      fill="rgba(255,255,255,0.18)" stroke-width="2"/>

    <!-- Hand dot (supporting arm, front) -->
    <circle cx="70" cy="92" r="4" fill="rgba(255,255,255,0.60)" stroke="none"/>
    <!-- Knee dot (supporting leg, rear) -->
    <circle cx="138" cy="92" r="4" fill="rgba(255,255,255,0.60)" stroke="none"/>

  </g>
</svg>
