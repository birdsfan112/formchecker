# Source clips for each of the 22 exercises.
# Scott curates this once. Pipeline reads from it.
#
# Fields per exercise:
#   urls      — list of clip URLs (Pexels, Pixabay, YouTube) or local file paths under pipeline/local/
#               v1 uses only the first URL; Step 5.7 adds multi-canonical support.
#   provider  — "pexels" | "pixabay" | "youtube" | "local" | "self"
#   trim      — [start_sec, end_sec] range covering ~1 clean rep/cycle
#   view      — "side" | "front" (informational; matches expected camera angle)
#   notes     — free-form; include license credit if required
#   phases_override — optional list of {name, frame_idx} to override auto-detected phases
#
# Leave urls empty to flag as "needs sourcing". Pipeline will skip and log.

squat:             { urls: ["https://www.pexels.com/video/woman-doing-a-squat-exercise-5025965/"], provider: "pexels", trim: [0, 0], view: "side",  notes: "smoke-test source" }
