# Source clips for each of the 22 exercises.
# Scott curates this once. Pipeline reads from it.
#
# Fields per exercise:
#   url       — clip URL (Pexels, Pixabay, or YouTube) or local file path under pipeline/local/
#   provider  — "pexels" | "pixabay" | "youtube" | "local" | "self"
#   trim      — [start_sec, end_sec] range covering ~1 clean rep/cycle
#   view      — "side" | "front" (informational; matches expected camera angle)
#   notes     — free-form; include license credit if required
#
# Leave url blank to flag as "needs sourcing". Pipeline will skip and log.

squat:             { url: "https://www.pexels.com/video/woman-doing-a-squat-exercise-5025965/", provider: "pexels", trim: [0, 0], view: "side",  notes: "smoke-test source" }
